[build-system]
requires = ["uv_build >= 0.9.18, <0.10.0"]
build-backend = "uv_build"

[project]
name = "latexzettel"
version = "1.2.0.0"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Alfred Holmes", email = "holmesey55@gmail.com" },
  { name = "Linn Abraham", email = "linn.official@gmail.com" },
]
maintainers = [
  { name = "Luis Fernando Umaña Castro", email = "luis.umanacastro@ucr.ac.cr" },
]
dependencies = ["peewee", "numpy", "watchdog", "click>=8.1"]

[project.optional-dependencies]
gui = ["networkx", "pygraphviz"]
dev = ["pytest"]

[project.scripts]
manage = "TexNotes.manage:main"
latexzettel = "latexzettel.cli.main:cli"
latexzettel-server = "latexzettel.server.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["latexzettel*", "TexNotes*"]


[tool.pytest.ini_options]
pythonpath = "."
